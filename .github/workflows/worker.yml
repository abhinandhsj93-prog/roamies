name: Deploy places API

# Deploys worker/ to Cloudflare Workers. Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (Cloudflare dashboard)
#   GEMINI_API_KEY                                (aistudio.google.com)
#   FIREBASE_SERVICE_ACCOUNT                      (Firebase → Project settings → Service accounts → Generate new private key)
# Until they are set, the job runs the tests and skips the deploy.

on:
  workflow_dispatch:
  push:
    branches: [expo-scaffold, main]
    paths: ['worker/**', '.github/workflows/worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Set worker secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put AI_API_KEY
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          true
