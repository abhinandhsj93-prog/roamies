name: Deploy places API

# Deploys worker/ to Cloudflare Workers. Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (Cloudflare dashboard)
#   GEMINI_API_KEY                                (aistudio.google.com)
#   FIREBASE_SERVICE_ACCOUNT                      (Firebase → Project settings → Service accounts → Generate new private key)
# Until they are set, the job runs the tests and skips the deploy.

on:
  workflow_dispatch:
  push:
    branches: [expo-scaffold, main]
    paths: ['worker/**', '.github/workflows/worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Worker URL::$url"
      - name: Set worker secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put AI_API_KEY
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
          true
      - name: Smoke test (Fort Kochi)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          debug=$(curl -sS -m 90 "${{ steps.deploy.outputs.url }}/debug?lat=9.9658&lng=76.2421" | jq -c '{locality: .locality.name, wikipedia: (.wikipedia|length), wikivoyage, sights: .sights[0:5], food: .food[0:5], errors}' || echo 'debug call failed')
          echo "::notice title=Sources::$(printf '%s' "$debug" | tr -d ':' | head -c 1500)"
          code=$(curl -sS -m 150 -o body.json -w '%{http_code}' "${{ steps.deploy.outputs.url }}/place?lat=9.9658&lng=76.2421" || echo timeout)
          summary=$(jq -rc '{status, error: (.error // null | if . then .[0:300] else null end), name: .place.name, area: .place.area, model: .place.model, spots: [.place.seeFirst.spots[]?.name], food: [.place.food[]?.name], slides: (.place.story | length?), briefing: .place.briefing}' body.json 2>/dev/null || head -c 300 body.json)
          echo "HTTP $code $summary"
          echo "::notice title=Smoke test::HTTP $code $(printf '%s' "$summary" | tr -d ':' | head -c 1500)"
